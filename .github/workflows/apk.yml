name: Construir app Android
on:
  push:
    paths:
      - 'android.zip'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Descomprimir proyecto
        run: unzip -q android.zip -d android
      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Copiar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SalvaCampo.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: App Salva Campo (Android)
          files: SalvaCampo.apk
          make_latest: true
