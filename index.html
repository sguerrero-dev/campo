<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Salva Energy · Campo</title>
<meta name="theme-color" content="#166748">
<style>
  :root{--verde:#166748;--verde2:#0F4A34;--fondo:#F3F6F4;--borde:#E1E8E4;--txt:#1F2A24;--suave:#5E6E66}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--fondo);color:var(--txt);-webkit-tap-highlight-color:transparent}
  header{background:var(--verde);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
  header .fila{display:flex;align-items:center;justify-content:space-between}
  header img{height:30px}
  header .salir{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:16px;padding:6px 12px;font-size:13px}
  header .hola{margin-top:12px;font-size:13px;opacity:.85}
  header .nombre{font-size:20px;font-weight:700}
  main{padding:14px 14px 90px;max-width:640px;margin:0 auto}
  .login{max-width:420px;margin:40px auto;padding:0 18px}
  .login .caja{background:#fff;border-radius:18px;padding:24px;border:1px solid var(--borde)}
  .login h2{margin:0 0 6px;color:var(--verde2)}
  .login p{margin:0 0 18px;color:var(--suave);font-size:14px}
  input,textarea{width:100%;font-size:17px;padding:13px 14px;border:1px solid #CBD6D0;border-radius:12px;font-family:inherit;background:#fff}
  textarea{min-height:80px;resize:vertical}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer}
  .btn.prim{background:var(--verde);color:#fff}
  .btn:disabled{opacity:.5}
  .err{color:#B3261E;font-size:14px;margin-top:10px;min-height:18px}
  .card{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:16px;margin-bottom:14px}
  .card.activa{border:2px solid var(--verde);box-shadow:0 6px 18px rgba(22,103,72,.15)}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .tit{font-size:17px;font-weight:700}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap}
  .b-Asignada{background:#E3EEFB;color:#0B5394}.b-En{background:#D9F2E3;color:#0B6A3B}
  .b-Suspendido{background:#FFF1CC;color:#7A5600}.b-Programado{background:#EADFF7;color:#5B2A86}
  .b-Cancelado{background:#FADADD;color:#8E192E}.b-Finalizado{background:#E6E9E7;color:#3C4A43}
  .desc{color:var(--suave);font-size:14px;margin-top:6px;white-space:pre-wrap}
  .meta{font-size:13px;color:var(--suave);margin-top:8px;line-height:1.6}
  .meta a{color:var(--verde);font-weight:600}
  .reloj{margin-top:12px;background:#0F4A34;color:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  .reloj b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .reloj small{opacity:.8;font-size:12px}
  .acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .acciones .btn{font-size:15px;padding:12px}
  .a-Suspendido{background:#FFF1CC;color:#7A5600}.a-Programado{background:#EADFF7;color:#5B2A86}
  .a-Cancelado{background:#FADADD;color:#8E192E}.a-Finalizado{background:#166748;color:#fff}
  .linea{margin-top:14px;border-top:1px dashed var(--borde);padding-top:10px}
  .linea .h{font-size:12px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .ev{display:flex;gap:10px;font-size:13px;padding:4px 0;position:relative}
  .ev .p{width:10px;height:10px;border-radius:50%;background:var(--verde);margin-top:4px;flex:0 0 10px}
  .ev .t{color:var(--suave);min-width:92px}
  .vacio{text-align:center;color:var(--suave);padding:40px 10px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal.on{display:flex}
  .hoja{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px 26px}
  .hoja h3{margin:0 0 12px}
  .hoja label{font-size:13px;color:var(--suave);display:block;margin:10px 0 6px}
  .fila2{display:flex;gap:8px;margin-top:16px}
  .fila2 .btn{flex:1}
  .gris{background:#EEF2F0;color:var(--txt)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F2A24;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:30;max-width:90%}
  .gps{font-size:12px;color:var(--suave);text-align:center;margin:-4px 0 12px}
  .ubi{background:#fff;border:2px solid var(--verde);border-radius:18px;padding:16px;margin-bottom:14px;text-align:center}
  .ubi .t1{font-weight:700;font-size:16px;color:var(--verde2)}
  .ubi .t2{font-size:13px;color:var(--suave);margin:6px 0 12px;line-height:1.5}
  .ubi.mal{border-color:#B3261E}
  .ubi.mal .t1{color:#B3261E}
  .ubiok{font-size:12px;color:#0B6A3B;text-align:center;margin:-4px 0 10px;font-weight:600}
</style>
</head>

<div class="login" id="vLogin">

<script>
let YO = null, TAREAS = [], pendiente = null;
const INTERVALO_GPS = 2 * 60 * 1000;
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m, ms){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||3000); }
const API = "https://script.google.com/macros/s/AKfycbw5YU5sxBXReGYxJn6zJcY1cbAqRq2siJkM7h8QsxDIeNLX756FiN8XSSaDgLZe4Q/exec";
async function api(fn, ...args){
  let r;
  try { r = await fetch(API, { method: "POST", credentials: "omit", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) }); }
  catch(e){ throw new Error("Sin conexión. Revisa tus datos o Wi-Fi."); }
  const j = await r.json().catch(() => ({ ok: false, error: "Respuesta inválida del servidor" }));
  if (!j.ok) throw new Error(j.error || "Error");
  return j.data;
}
function guardar(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }
function leer(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }

function ubicacion(){
  return new Promise(res=>{
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ estadoUbi(true); res({lat:p.coords.latitude.toFixed(6), lon:p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}); },
      e=>{ $('gps').textContent=''; if(e.code===1) estadoUbi(false,'⚠️ Ubicación bloqueada', avisoBloqueo(), '🔄 Reintentar'); else estadoUbi(false,'⚠️ El GPS está apagado','Enciende la ubicación del celular y luego toca Reintentar.', '🔄 Reintentar'); res(null); },
      {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
  });
}

async function entrar(){
  const c = $('ced').value.trim(); if(!c) return;
  $('bEntrar').disabled = true; $('errLogin').textContent='';
  try{ YO = await api('login', c); guardar('cedula', YO.cedula); mostrarApp(); }
  catch(e){ $('errLogin').textContent = e.message || 'No se pudo entrar'; }
  $('bEntrar').disabled = false;
}
function salir(){ guardar('cedula', null); location.reload(); }


function estadoUbi(ok, t1, t2, boton){
  $('ubi').style.display = ok ? 'none' : 'block';
  $('lista').style.display = ok ? 'block' : 'none';
  $('ubiOk').style.display = ok ? 'block' : 'none';
  $('ubi').classList.toggle('mal', !!t1);
  $('ubiT1').textContent = t1 || '📍 Activa tu ubicación';
  $('ubiT2').textContent = t2 || 'Es obligatorio activar la ubicación para ver y trabajar tus tareas.';
  $('bUbi').textContent = boton || '📍 Permitir ubicación';
  if(ok){ guardar('gpsOk','1'); $('gps').textContent=''; }
}
function avisoBloqueo(){
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  return ios ? '1) Ajustes › Privacidad y seguridad › Localización: actívala y en "Sitios web de Safari" elige "Al usar la app". 2) En Safari toca el ícono a la izquierda de la dirección › Configuración del sitio web › Ubicación › Permitir. Luego toca Reintentar.'
             : 'El permiso está bloqueado. Toca el candado 🔒 junto a la dirección de arriba › Permisos › Ubicación › Permitir. Luego toca Reintentar.';
}
function permitirUbicacion(){
  if(!navigator.geolocation){ estadoUbi(false,'⚠️ Este celular no permite ubicación','Prueba abriendo el link en Chrome o Safari.'); return; }
  $('bUbi').disabled = true; $('bUbi').textContent = 'Activando…';
  navigator.geolocation.getCurrentPosition(
    ()=>{ $('bUbi').disabled=false; estadoUbi(true); toast('✅ Ubicación activada'); },
    e=>{ $('bUbi').disabled=false; guardar('gpsOk',null);
      if(e.code===1) estadoUbi(false,'⚠️ Ubicación bloqueada', avisoBloqueo(), '🔄 Reintentar');
      else estadoUbi(false,'⚠️ El GPS está apagado','Enciende la ubicación del celular (desliza desde arriba y toca "Ubicación") y luego toca Reintentar.', '🔄 Reintentar');
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
async function revisarUbicacion(){
  estadoUbi(false,'','Activando tu ubicación… toca "Permitir" cuando el celular lo pregunte.','Activando…');
  permitirUbicacion();
  try{
    if(navigator.permissions && navigator.permissions.query){
      const st = await navigator.permissions.query({name:'geolocation'});
      st.onchange = ()=>{ if(st.state==='granted') estadoUbi(true); else permitirUbicacion(); }; return;
    }
  }catch(e){}
}

async function mostrarApp(){
  $('vLogin').style.display='none'; $('vApp').style.display='block';
  $('saludo').style.display='block'; $('salir').style.display='inline-block';
  $('nombre').textContent = YO.nombre;
  revisarUbicacion();
  await cargar();
  setInterval(cargar, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ cargar(); if($('ubi').style.display!=='none') permitirUbicacion(); } });
}

async function cargar(){
  try{ TAREAS = await api('misTareas', YO.cedula); pintar(); }catch(e){ toast(e.message||'Sin conexión'); }
}

function dur(desde){
  const ms = Date.now() - new Date(desde.replace(' ','T')+'-05:00').getTime();
  const s = Math.max(0, Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');
}
function fmt(f){ if(!f) return ''; const d=new Date(f.replace(' ','T')+'-05:00'); return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

function pintar(){
  if(!TAREAS.length){ $('lista').innerHTML='<div class="vacio">No tienes tareas asignadas por ahora.<br>Esta pantalla se actualiza sola.</div>'; return; }
  $('lista').innerHTML = TAREAS.map(t=>{
    const act = t.Estado==='En ejecución', cerrada = t.Estado==='Finalizado'||t.Estado==='Cancelado';
    const bcls = 'b-'+(t.Estado||'Asignada').split(' ')[0];
    let h = `<div class="card ${act?'activa':''}"><div class="top"><div class="tit">${esc(t.Titulo)}</div><span class="badge ${bcls}">${esc(t.Estado||'Asignada')}</span></div>`;
    if(t.Descripcion) h += `<div class="desc">${esc(t.Descripcion)}</div>`;
    h += `<div class="meta">`;
    if(t.Direccion) h += `📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.Direccion)}" target="_blank">${esc(t.Direccion)}</a><br>`;
    h += `🕒 Asignada: ${fmt(t.FechaAsignacion)}${t.AsignadoPor?' · por '+esc(t.AsignadoPor):''}`;
    if(t.FechaProgramada) h += `<br>📅 Programada: ${esc(t.FechaProgramada.replace('T',' '))}`;
    if(t.MinutosTrabajados && Number(t.MinutosTrabajados)>0) h += `<br>⏱ Tiempo acumulado: ${t.MinutosTrabajados} min`;
    h += `</div>`;
    if(act) h += `<div class="reloj"><div><small>En ejecución desde ${fmt(t.InicioRuta)}</small><br><b data-desde="${esc(t.InicioRuta)}">${dur(t.InicioRuta)}</b></div><div style="font-size:26px">🚐</div></div>
      <div class="acciones">${['Suspendido','Programado','Cancelado','Finalizado'].map(a=>`<button class="btn a-${a}" onclick="pedir('${t.ID}','${a}')">${{Suspendido:'Suspender',Programado:'Programar',Cancelado:'Cancelar',Finalizado:'Finalizar'}[a]}</button>`).join('')}</div>`;
    else if(!cerrada) h += `<div style="margin-top:12px"><button class="btn prim" onclick="accion('${t.ID}','Iniciar')">▶ ${t.Estado==='Asignada'||!t.Estado?'Iniciar ruta':'Reanudar ruta'}</button></div>`;
    if(t.eventos && t.eventos.length){
      h += `<div class="linea"><div class="h">Línea de tiempo</div>` + t.eventos.map(e=>`<div class="ev"><span class="p"></span><span class="t">${fmt(e.FechaHora)}</span><span><b>${esc(e.Estado)}</b>${e.Comentario?' — '+esc(e.Comentario):''}</span></div>`).join('') + `</div>`;
    }
    return h + `</div>`;
  }).join('');
}
setInterval(()=>document.querySelectorAll('[data-desde]').forEach(el=>el.textContent=dur(el.dataset.desde)), 1000);

function pedir(id, a){
  pendiente = {id, a};
  $('mTit').textContent = {Suspendido:'Suspender tarea',Programado:'Programar para otro momento',Cancelado:'Cancelar tarea',Finalizado:'Finalizar tarea'}[a];
  $('mProg').style.display = a==='Programado'?'block':'none';
  $('mLbl').textContent = a==='Finalizado' ? 'Comentario (opcional)' : 'Motivo';
  $('mCom').value=''; $('mFecha').value='';
  $('mOk').onclick = ()=>{
    const com = $('mCom').value.trim(), f = $('mFecha').value;
    if(a!=='Finalizado' && !com){ toast('Escribe el motivo'); return; }
    if(a==='Programado' && !f){ toast('Elige la fecha y hora'); return; }
    cerrarModal(); accion(id, a, com, f ? f.replace('T',' ') : '');
  };
  $('modal').classList.add('on');
}
function cerrarModal(){ $('modal').classList.remove('on'); }

async function accion(id, a, com, fecha){
  toast('Verificando ubicación…', 6000);
  const pos = await ubicacion();
  if(!pos){ toast('⚠️ Debes tener la ubicación activa para continuar.', 5000); window.scrollTo(0,0); return; }
  const p = a==='Iniciar' ? pos : null;
  try{
    TAREAS = await api('cambiarEstado', YO.cedula, id, a, p?p.lat:'', p?p.lon:'', p?p.acc:'', com||'', fecha||'');
    pintar(); toast(a==='Iniciar' ? 'Ruta iniciada ✔' : 'Guardado ✔');
  }catch(e){ toast(e.message||'No se pudo guardar', 5000); }
}

async function enviarGps(){
  const activas = TAREAS.filter(t=>t.Estado==='En ejecución'); if(!activas.length) return;
  const p = await ubicacion(); if(!p) return;
  $('gps').textContent = '📡 Ubicación enviada ' + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  for(const t of activas){ try{ await api('reportarUbicacion', YO.cedula, t.ID, p.lat, p.lon, p.acc); }catch(e){} }
}

(async ()=>{
  const c = leer('cedula');
  if(c){ try{ YO = await api('login', c); mostrarApp(); return; }catch(e){ guardar('cedula', null); } }
})();
</script>
